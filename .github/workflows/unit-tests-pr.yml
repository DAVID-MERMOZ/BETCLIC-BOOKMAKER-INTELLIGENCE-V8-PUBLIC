name: Betclic V8.1 - PR unit tests (no secrets)

on:
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install git+https://github.com/TapsHTS/betclic-api.git
      - name: Run unit tests (no private database or secrets)
        run: python -m unittest discover -s tests -v

name: BETCLIC V8.1 - Pilot model validation

on:
  push:
    branches: [main]
    paths:
      - "team_form_model_experiment.py"
      - "database.py"
      - "betclic_probe.py"
      - "daily_fixture_sample.py"
      - "telegram_notify.py"
      - "tests/test_telegram_notify.py"
      - "baseline_market_evaluation.py"
      - "tests/**"
      - "dashboard.py"
      - "requirements.txt"
      - ".github/workflows/pilot-validation.yml"
  workflow_dispatch:

concurrency:
  group: betclic-pilot-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances du pilote et du collecteur Betclic
        run: |
          pip install scikit-learn==1.9.1 joblib==1.6.0
          pip install git+https://github.com/TapsHTS/betclic-api.git

      - name: Restaurer la base privee en lecture seule
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          mkdir -p data /tmp/betclic-pilot
          gh release download betclic-db-latest \
            --repo DAVID-MERMOZ/BETCLIC-BOOKMAKER-INTELLIGENCE-V8 \
            --pattern "betclic_history.db.gz" \
            --dir /tmp/betclic-pilot
          gzip -dc /tmp/betclic-pilot/betclic_history.db.gz > data/betclic_history.db
          test -s data/betclic_history.db
          python -c "import sqlite3; c=sqlite3.connect('file:data/betclic_history.db?mode=ro', uri=True); print('SQLITE:', c.execute('PRAGMA integrity_check').fetchone()[0]); print('TABLES:', c.execute(\"SELECT count(*) FROM sqlite_master WHERE type='table'\").fetchone()[0]); c.close()"

      - name: Auditer la maturite des donnees historiques (lecture seule)
        run: python model_readiness_audit.py

      - name: Actualiser les fixtures et cotes Betclic avant les predictions
        run: python betclic_probe.py

      - name: Executer les tests
        run: python -m unittest discover -s tests -v

      - name: Entrainer le pilote sur les matchs admissibles
        run: python team_form_model_experiment.py

      - name: Generer les predictions echantillon des matchs du jour
        run: python daily_fixture_sample.py

      - name: Notifier le nouvel echantillon de predictions sur Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PREDICTIONS_FILE: reports/todays_sample_predictions.csv
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python telegram_notify.py

      - name: Publier le modele et le rapport du pilote
        if: always() && (hashFiles('reports/*.csv') != '' || hashFiles('artifacts/*.joblib') != '')
        uses: actions/upload-artifact@v4
        with:
          name: betclic-pilot-model-${{ github.run_id }}
          path: |
            reports/team_form_predictions.csv
            reports/todays_sample_predictions.csv
            artifacts/team_form_model.joblib
          if-no-files-found: warn
          retention-days: 30

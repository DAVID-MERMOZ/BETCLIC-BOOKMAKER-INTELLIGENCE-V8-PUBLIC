name: BETCLIC V8.1 - Public runner, private data

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/betclic_history.db"
      - "team_form_model_experiment.py"
      - "baseline_market_evaluation.py"
      - "tests/**"
      - "dashboard.py"
      - "requirements.txt"
      - "README.md"
      - ".github/workflows/main.yml"
      - ".github/workflows/pilot-validation.yml"
      - "database_diagnostic.py"
      - "odds_analysis.py"
      - "match_validation_registry.py"
      - "telegram_notify.py"
      - "telegram_dedup.py"
      - "daily_fixture_sample.py"
      - "lightweight_change_collector.py"
      - "targeted_market_refresh.py"
      - "reports/telegram_prediction_state.json"
      - "prediction_history_evaluation.py"

  workflow_dispatch:

  schedule:
    - cron: "30 * * * *"

concurrency:
  group: betclic-prediction-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchroniser le commit et l'etat depuis main avant le pipeline
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer la bibliotheque Betclic
        run: pip install git+https://github.com/TapsHTS/betclic-api.git

      - name: Installer les dependances du modele exploratoire
        run: pip install scikit-learn

      - name: Tester la selection des matchs pre-match
        run: python -m unittest discover -s tests -v

      - name: Initialiser le schema SQLite (sans effacer les donnees)
        run: python database.py

      - name: Verifier les secrets requis pour la base privee
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPO_TOKEN" || { echo "Secret PRIVATE_REPO_TOKEN manquant"; exit 1; }
          test -n "$FOOTBALL_DATA_API_TOKEN" || { echo "Secret FOOTBALL_DATA_API_TOKEN manquant"; exit 1; }

      - name: Restaurer la derniere sauvegarde durable (si disponible)
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view betclic-db-latest --repo DAVID-MERMOZ/BETCLIC-BOOKMAKER-INTELLIGENCE-V8 >/dev/null 2>&1; then
            echo "Sauvegarde durable trouvee : restauration en cours."
            gh release download betclic-db-latest \
              --repo DAVID-MERMOZ/BETCLIC-BOOKMAKER-INTELLIGENCE-V8 \
              --pattern "betclic_history.db.gz" \
              --dir /tmp
            gzip -dc /tmp/betclic_history.db.gz > /tmp/betclic_remote.db
            python merge_database.py /tmp/betclic_remote.db
            rm -f /tmp/betclic_remote.db /tmp/betclic_history.db.gz
          else
            echo "ERREUR : sauvegarde privee introuvable ; arret pour proteger l'historique." 
            exit 1
          fi

      - name: Verifier la couverture Football-Data (lecture seule)
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: python football_data_probe.py

      - name: Collecter les resultats termines Football-Data
        env:
          FOOTBALL_DATA_API_TOKEN: ${{ secrets.FOOTBALL_DATA_API_TOKEN }}
        run: python football_data_results.py

      - name: Collecter les resultats SportScore (football, lecture par date)
        run: python sportscore_results.py

      - name: Corriger les scores valides et exporter les correspondances confirmees
        run: python apply_validated_results.py

      - name: Executer la collecte Betclic
        timeout-minutes: 15
        run: python betclic_probe.py

      - name: Analyser les cotes
        run: python odds_analysis.py

      - name: Verifier integrite et contenu SQLite (lecture seule)
        run: python database_diagnostic.py

      - name: Auditer les donnees disponibles pour le modele (lecture seule)
        run: python model_readiness_audit.py

      - name: Evaluer le benchmark historique du marche 1X2 (lecture seule)
        run: python baseline_market_evaluation.py

      - name: Entrainer et evaluer le modele predictif 1X2 hors periode
        run: python predictive_model_experiment.py

      - name: Evaluer le modele independant de forme des equipes
        run: python team_form_model_experiment.py

      - name: Generer le tableau quotidien unique pour Telegram
        run: python daily_fixture_sample.py

      - name: Detecter les changements de cotes sans modifier la base
        run: python lightweight_change_collector.py

      - name: Actualiser les probabilites de marche des matchs affectes
        run: python targeted_market_refresh.py

      - name: Archiver les predictions et evaluer les resultats confirmes
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python prediction_history.py

      - name: Evaluer les predictions historiques pre-match (lecture seule)
        run: python prediction_history_evaluation.py

      - name: Notifier les predictions sur Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PREDICTIONS_FILE: reports/todays_sample_predictions.csv
        run: python telegram_notify.py

      - name: Generer le rapport de rapprochement (lecture seule)
        run: python match_results_report.py

      - name: Generer le registre de validation humaine localement (non publie)
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python match_validation_registry.py

      - name: Publier les rapports et le modele experimental
        if: always() && (hashFiles('reports/prediction_feedback_status.csv') != '' || hashFiles('reports/prediction_history_evaluation.csv') != '')
        uses: actions/upload-artifact@v4
        with:
          name: betclic-model-and-reports-${{ github.run_id }}
          path: |
            reports/prediction_feedback_status.csv
            reports/prediction_history_evaluation.csv
          if-no-files-found: warn
          retention-days: 30

